name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .quartz/.node-version
          cache: npm
          cache-dependency-path: .quartz/package-lock.json

      - name: Install dependencies
        working-directory: .quartz
        run: npm ci

      # Git-sourced plugins land in .quartz/.quartz/plugins/, which is
      # gitignored, and the build command does not fetch them on its own.
      # Without this step the site builds fine but silently drops them.
      - name: Install git plugins
        working-directory: .quartz
        run: npm run install-plugins

      - name: Build site
        working-directory: .quartz
        run: node ./quartz/bootstrap-cli.mjs build -d ../content -o ../public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
